name: Eurotyre Market Price Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: eurotyre-market-radar
  cancel-in-progress: false

jobs:
  collect:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eurotyre-streamlit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect approved feeds into private PostgreSQL
        env:
          RADAR_DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          RADAR_SOURCES_JSON: ${{ secrets.RADAR_SOURCES_JSON }}
          RADAR_WORKSPACE: ${{ vars.RADAR_WORKSPACE || 'eurotyre' }}
        run: python -m eurotyre.radar.cli
